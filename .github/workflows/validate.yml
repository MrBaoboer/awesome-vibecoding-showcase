name: Validate content

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and fields (C1-C5 / D1-D5)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate catalog fields
        run: >-
          python scripts/validate_catalog.py
          --repository "${{ github.repository }}"

      - name: Verify approved review Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_review_issues.py
          --repository "${{ github.repository }}"

      - name: Validate cross-file repository contracts
        run: python scripts/validate_repository.py

      - name: Test catalog contract
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Check generated README regions
        run: python scripts/render_catalog.py --check

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: ".markdownlint.json"
          globs: |
            **/*.md
