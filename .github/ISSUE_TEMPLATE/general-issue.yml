name: "通用问题 / General issue"
description: "报告错误、失效链接、项目更新或仓库问题。 / Report an error, broken link, project update, or repository issue."
title: "[Issue]: "
labels:
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        新项目请使用“项目提交 / Project submission”表单。安全漏洞请按安全政策私下报告。

        Use “项目提交 / Project submission” for a new project. Report vulnerabilities privately under the security policy.

  - type: dropdown
    id: issue_type
    attributes:
      label: "问题类型 / Issue type"
      options:
        - "失效链接 / Broken link"
        - "事实错误 / Factual error"
        - "项目更新 / Project update"
        - "下架建议 / Removal request"
        - "分类问题 / Classification"
        - "文档或翻译 / Documentation or translation"
        - "其他 / Other"
    validations:
      required: true

  - type: input
    id: affected_project
    attributes:
      label: "涉及的项目或位置 / Affected project or location（可选 / optional）"

  - type: textarea
    id: description
    attributes:
      label: "问题说明 / Description"
      description: "说明需要修正的内容和期望结果。 / Explain what should change and the expected result."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "证据或参考链接 / Evidence or references（可选 / optional）"
      description: "事实性修改请附公开来源。 / Include a public source for factual changes."

  - type: textarea
    id: project_details
    attributes:
      label: "项目核验信息 / Project verification（如适用 / if applicable）"
      description: |
        仅用于项目更新、纠错或下架：说明受影响的内容、当前事实和公开依据。可涉及在线体验与源码（C1 / C2 / D5）、AI 参与（C3 / D4）、质量与真实性（C4 / C5），或问题、功能价值与技术栈（D1 / D2 / D3）。

        For a project update, correction, or removal request, state what is affected, the current facts, and public evidence. This may cover the live product and source (C1 / C2 / D5), AI involvement (C3 / D4), quality and authenticity (C4 / C5), or the problem, features, value, and stack (D1 / D2 / D3).
