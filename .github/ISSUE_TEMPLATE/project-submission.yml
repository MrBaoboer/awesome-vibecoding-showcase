name: "项目提交 / Project submission"
description: "提交可公开体验、源码公开且由 AI 实质参与开发的产品。 / Submit a public product with public source code, substantially built with AI."
title: "[Submission]: "
labels:
  - "submission"
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        一个 Issue 只提交一个项目。请填写公开、可核验的信息，不要提交密钥、私人对话或个人敏感信息。

        Submit one project per issue. Use public, verifiable information and do not include secrets, private conversations, or personal data.

  - type: input
    id: project_name
    attributes:
      label: "产品名称 / Product name（C5）"
      placeholder: "Example Product"
    validations:
      required: true

  - type: input
    id: public_demo_url
    attributes:
      label: "在线体验 / Live product or demo（C1 / D5）"
      description: "填写审核者可以访问并验证核心流程的地址。 / Provide a URL where a reviewer can test the core flow."
      placeholder: "https://example.com"
    validations:
      required: true

  - type: input
    id: source_repository_url
    attributes:
      label: "公开源码 / Public source repository（C2 / D5）"
      description: "仓库须公开并包含产品主体源码。 / The repository must be public and contain the substantive product source."
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "解决的问题 / Problem solved（D1）"
      description: "说明目标用户、使用场景和具体问题。 / Identify the target user, context, and concrete problem."
    validations:
      required: true

  - type: textarea
    id: features_and_value
    attributes:
      label: "核心功能与实际价值 / Core features and value（C4 / D2）"
      description: "列出可用的核心功能及其价值，并给出可复现流程或完成度、实用性、创新性的公开依据。 / List working core features and their value, with a reproducible flow or public evidence of completeness, utility, or innovation."
    validations:
      required: true

  - type: input
    id: tech_stack
    attributes:
      label: "主要技术栈 / Main technology stack（D3）"
      placeholder: "Next.js, TypeScript, PostgreSQL"
    validations:
      required: true

  - type: textarea
    id: ai_role_and_evidence
    attributes:
      label: "AI 开发角色与证据 / AI development role and evidence（C3 / C5 / D4）"
      description: "说明使用的工具、AI 主要实现的核心代码、典型协作方式，并附公开证据链接。 / State the tools, core code mainly implemented by AI, typical workflow, and a public evidence URL."
      placeholder: |
        AI 工具 / AI tools:
        参与深度 / Depth:
        协作方式 / Workflow:
        公开证据 / Public evidence:
    validations:
      required: true

  - type: textarea
    id: authenticity
    attributes:
      label: "真实性与核验说明 / Authenticity and verification（C5）"
      description: "说明你与项目的关系、体验版本与源码的对应关系及已知限制。 / State your relationship to the project, how the live version maps to the source, and known limitations."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: "提交确认 / Confirmation"
      options:
        - label: "这是可运行的产品，不是 AI 编程工具、IDE、编辑器、插件或模型；我有权公开提交内容。 / This is a working product, not an AI coding tool, IDE, editor, plugin, or model; I have the right to publish the submitted material."
          required: true
