name: "项目提交 / Project submission"
description: "提名由 AI 实质参与开发、可公开体验且源码公开的产品。 / Nominate a public, open-source product substantially built with AI."
title: "[Submission]: "
labels:
  - "submission"
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        感谢你的提名。这里只收录最终可运行的软件产品；开发工具、IDE、编辑器、插件、模型、纯概念和无法核验的项目不在收录范围内。

        请勿提交密钥、私有对话或其他敏感信息。所有 C1–C5 必须同时满足，D1–D5 必须完整填写。

        Thank you for your submission. We list only working products—not coding tools, IDEs, editors, plugins, models, concepts, or unverifiable projects. Never submit secrets or private conversations. All C1–C5 and D1–D5 fields are mandatory.

  - type: input
    id: project_name
    attributes:
      label: "产品名称 / Product name（C5）"
      description: "填写产品公开名称。 / Enter the product's public name."
      placeholder: "Example Product"
    validations:
      required: true

  - type: input
    id: public_demo_url
    attributes:
      label: "在线体验 / Live product or demo（C1 / D5）"
      description: "必须公开可访问；若需注册，请说明步骤。 / Must be publicly accessible; explain any sign-up steps."
      placeholder: "https://example.com"
    validations:
      required: true

  - type: input
    id: source_repository_url
    attributes:
      label: "公开源码 / Public source repository（C2 / D5）"
      description: "仓库须公开并包含主体源码。 / Must be public and contain the substantive product source."
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "产品解决的问题 / Problem solved（D1）"
      description: "说明目标用户、具体场景和需要解决的问题；请避免只写宣传语。 / Identify the target users, use case, and specific problem; avoid marketing-only claims."
      placeholder: |
        目标用户 / Target users：
        使用场景 / Use case：
        需要解决的问题 / Problem：
    validations:
      required: true

  - type: textarea
    id: features_and_value
    attributes:
      label: "核心功能与实际价值 / Features and value（C4 / D2）"
      description: "列出已上线的核心功能及其实际价值或创新点。 / List shipped core features and the real value or innovation each provides."
      placeholder: |
        - 核心功能 1 / Core feature 1：……；实际价值 / Value：……
        - 核心功能 2 / Core feature 2：……；实际价值 / Value：……
        当前完成度 / Current completeness：
    validations:
      required: true

  - type: textarea
    id: tech_stack
    attributes:
      label: "主要技术栈 / Main technology stack（D3）"
      description: "列出产品主体使用的前端、后端、数据存储和部署技术。 / List the main frontend, backend, storage, and deployment technologies used by the product."
      placeholder: "例如 / Example：Next.js、TypeScript、PostgreSQL、Docker"
    validations:
      required: true

  - type: textarea
    id: ai_role
    attributes:
      label: "AI 在开发中的角色 / AI development role（C3 / D4）"
      description: "必须说明 AI 工具、参与深度和典型协作方式；仅写“使用了 AI”不够。 / State the AI tools, depth of involvement, and typical workflow; “used AI” alone is insufficient."
      placeholder: |
        使用的 AI 工具 / AI tools used：
        参与深度（AI 主要实现了哪些核心代码）/ Depth (core code mainly implemented by AI)：
        典型协作方式（自然语言如何驱动设计、实现与迭代）/ Workflow (how natural language drove design, implementation, and iteration)：
        人类开发者主要负责 / Human developer responsibilities：
    validations:
      required: true

  - type: textarea
    id: ai_evidence
    attributes:
      label: "AI 实质参与证据 / Public AI contribution evidence（C3 / C5 / D4）"
      description: "提供至少一种可公开核验的证据，如开发说明、公开日志、相关 Issue/PR 或脱敏过程记录。 / Provide at least one publicly verifiable source, such as development notes, a public log, a related Issue/PR, or a redacted process record."
      placeholder: |
        证据链接 / Evidence URL：
        证据说明 / What the evidence shows：
    validations:
      required: true

  - type: dropdown
    id: category_pair
    attributes:
      label: "一级 / 二级分类 / Category pair（C4）"
      description: "按产品解决的主要问题选择唯一组合；边界见 docs/CATEGORIES.md。 / Choose one pair based on the main problem solved; see docs/CATEGORIES.en.md for boundaries."
      options:
        - "productivity-collaboration / task-workflow"
        - "productivity-collaboration / communication-collaboration"
        - "productivity-collaboration / personal-productivity"
        - "business-operations / commerce-sales"
        - "business-operations / finance-administration"
        - "business-operations / customer-service"
        - "education-knowledge / learning-training"
        - "education-knowledge / research-reference"
        - "education-knowledge / knowledge-management"
        - "data-decision / analytics-visualization"
        - "data-decision / planning-forecasting"
        - "data-decision / decision-support"
        - "creative-media / writing-publishing"
        - "creative-media / design-visual"
        - "creative-media / audio-video"
        - "health-lifestyle / health-wellness"
        - "health-lifestyle / home-daily-life"
        - "health-lifestyle / travel-local"
        - "community-public-good / civic-public-service"
        - "community-public-good / accessibility-inclusion"
        - "community-public-good / community-nonprofit"
        - "games-entertainment / games-interactive"
        - "games-entertainment / social-entertainment"
        - "games-entertainment / hobbies-fandom"
    validations:
      required: true

  - type: textarea
    id: quality_evidence
    attributes:
      label: "成果质量证据 / Outcome quality evidence（C4）"
      description: "说明已验证的核心流程，并提供截图、文档、用户反馈或其他公开依据；不要只给未经证实的指标。 / Describe a verified core flow and provide public support such as screenshots, documentation, or user feedback; do not rely on unverified metrics."
      placeholder: |
        可复现的核心使用流程 / Reproducible core flow：
        完成度、实用性或创新性依据 / Evidence of completeness, utility, or innovation：
        相关公开链接（如有）/ Related public URLs (if any)：
    validations:
      required: true

  - type: textarea
    id: authenticity
    attributes:
      label: "真实性与可验证性 / Authenticity and verification（C5）"
      description: "说明提交人与项目的关系、体验与源码的对应关系，以及审核限制。 / Disclose your relationship to the project, how the live version maps to the source, and any review limitations."
      placeholder: |
        我与项目的关系 / My relationship to the project：
        体验版本与源码仓库的对应关系 / How the live version maps to the source：
        访问限制或已知问题 / Access restrictions or known issues：
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: "补充信息 / Additional context（可选 / optional）"
      description: "可补充许可证、演示账号说明、媒体资料等；请勿粘贴密码或密钥。 / Add licensing, demo-account instructions, media, or other useful context; never paste passwords or secrets."

  - type: checkboxes
    id: eligibility_confirmation
    attributes:
      label: "收录条件确认 / Eligibility confirmation"
      description: "以下五项缺一不可。 / All five conditions are mandatory."
      options:
        - label: "产品、演示或在线体验可公开访问（C1）。 / The product or demo is publicly accessible (C1)."
          required: true
        - label: "产品主体源码仓库公开可访问（C2）。 / The substantive source repository is public (C2)."
          required: true
        - label: "AI 实质参与核心功能实现，而非仅写文档、测试、少量修复或生成素材（C3）。 / AI substantially implemented core features, not only docs, tests, minor fixes, or assets (C3)."
          required: true
        - label: "产品具备可验证的完成度、实用性或创新性（C4）。 / The product has verifiable completeness, utility, or innovation (C4)."
          required: true
        - label: "以上信息真实、可验证，项目不是纯概念或无法运行的演示（C5）。 / The information is authentic and verifiable; this is not a concept or non-working demo (C5)."
          required: true

  - type: checkboxes
    id: scope_confirmation
    attributes:
      label: "范围与信息确认 / Scope and information confirmation"
      options:
        - label: "该条目是可运行的软件产品，不是 AI 编程工具、IDE、编辑器、插件或模型。 / This is a working product, not an AI coding tool, IDE, editor, plugin, or model."
          required: true
        - label: "我已完整填写问题、功能与价值、技术栈、AI 角色及两个地址（D1–D5）。 / I completed the problem, features and value, stack, AI role, and both URLs (D1–D5)."
          required: true
        - label: "我已移除密钥、私人对话、个人敏感信息及无权公开的内容。 / I removed secrets, private chats, personal data, and unauthorized content."
          required: true
